<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website Layout</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTTXRNF5E2Cl06tTzJ5p6hE/Az6XcBvQ6wrVqV1Z3YtVbCJHlz8pB6uVKnPdbGV4kDx1zjwO1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Main Heading */
        .main-heading {
           
            padding: 20px;
            background-color: #f4f4f4;
            font-size: 2em;
        }

        /* Header Section */
        header {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
            color: white;
        }

        header .icon {
            margin-right: 15px;
            font-size: 1.5em;
        }

        header .header-title {
            font-size: 1.5em;
        }

        /* Four Headings Section */
        .four-headings {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background-color: #e2e2e2;
        }

        .four-headings div {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            width: 20%;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            
        }

        /* Button Section */
        .button-section {
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .button-section button {
            background-color: #4CAF50; /* Green background */
            color: white; /* White text */
            padding: 15px 30px; /* Padding */
            font-size: 16px; /* Font size */
            border: none; /* No border */
            border-radius: 5px; /* Rounded corners */
            cursor: pointer; /* Pointer cursor on hover */
            transition: background-color 0.3s; /* Smooth transition */
        }

        .button-section button:hover {
            background-color: #45a049; /* Darker green on hover */
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .four-headings {
                flex-direction: column;
                align-items: center;
            }

            .four-headings div {
                width: 80%;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Main Heading -->
    <div class="main-heading">
        Home
    </div>

    <!-- Header with Icon and Heading -->
    <header>
        <i class="fas fa-home icon"></i> <!-- Font Awesome Home Icon -->
        <div class="header-title">Welcome to My Website</div>
    </header>

    <!-- Section with Four Headings -->
    <div class="four-headings">
        <div>
            <h2>Heading 1</h2>
            <p>Some description here.</p>
        </div>
        <div>
            <h2>Heading 2</h2>
            <p>Some description here.</p>
        </div>
        <div>
            <h2>Heading 3</h2>
            <p>Some description here.</p>
        </div>
        <div>
            <h2>Heading 4</h2>
            <p>Some description here.</p>
        </div>
    </div>

    <!-- Button Section -->
    <div class="button-section">
        <button>Click Me</button>
    </div>

</body>
</html>
